name: Auto Update Recent Project

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours automatically
  workflow_dispatch:          # lets you run it manually from GitHub Actions with 1-click
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Recent Project Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python .github/scripts/update_recent_project.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/recent-project.svg README.md
          if git diff --staged --quiet; then
            echo "No changes in recent project."
          else
            git commit -m "chore: auto-update latest project card [skip ci]"
            git push
          fi
