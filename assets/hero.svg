<text x="88" y="283" clip-path="url(#c2)">COMPUTER VISION BUILDER</text>
<text x="88" y="283" clip-path="url(#c3)">RAG SYSTEMS EXPLORER</text>
<text x="88" y="283" clip-path="url(#c4)">ROBOTICS &amp; IoT ENTHUSIAST</text>
<text x="88" y="283" clip-path="url(#c5)">AI × HARDWARE ENGINEER IN PROGRESS</text>
</g>
<text class="m" x="62" y="326" font-size="12" fill="#8b9bab" letter-spacing="1.5">LOVELY PROFESSIONAL UNIVERSITY · B.TECH CSE · 2028</text>
<text class="m" x="62" y="352" font-size="12" fill="#5c6f82">intelligent systems that connect software with the physical world</text>

