<line x1="0" y1="48" x2="1000" y2="48" stroke="#12202e"/>

<rect x="2" y="48" width="996" height="60" fill="url(#scan)"><animateTransform attributeName="transform" type="translate" values="0 0;0 288;0 0" dur="8s" repeatCount="indefinite"/></rect>

<circle class="blink" cx="64" cy="92" r="4" fill="#3ddc97"/>
