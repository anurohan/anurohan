<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Raushan Kumar — AI × Software × Hardware">
<title>Raushan Kumar — AI × Software × Hardware</title>
<defs>
<style>
.m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.blink{animation:b 1.6s infinite}
@keyframes b{0%,49%{opacity:1}50%,100%{opacity:0}}
.dash{stroke-dasharray:6 8;animation:d 1.2s linear infinite}
@keyframes d{to{stroke-dashoffset:-14}}
</style>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0f1a26" stroke-width="1"/></pattern>
<linearGradient id="scan" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4fd8ff" stop-opacity="0"/><stop offset="1" stop-color="#4fd8ff" stop-opacity=".16"/></linearGradient>
<radialGradient id="glow" cx=".82" cy=".5" r=".5"><stop offset="0" stop-color="#4fd8ff" stop-opacity=".12"/><stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/></radialGradient>
<clipPath id="c0"><rect x="88" y="260" height="30" width="0"><animate attributeName="width" values="0;202;202;0;0" keyTimes="0;0.06;0.155;0.1666;1" dur="24s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="c1"><rect x="88" y="260" height="30" width="0"><animate attributeName="width" values="0;0;290;290;0;0" keyTimes="0;0.1666;0.2266;0.3216;0.3332;1" dur="24s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="c2"><rect x="88" y="260" height="30" width="0"><animate attributeName="width" values="0;0;290;290;0;0" keyTimes="0;0.3332;0.3932;0.4882;0.4998;1" dur="24s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="c3"><rect x="88" y="260" height="30" width="0"><animate attributeName="width" values="0;0;252;252;0;0" keyTimes="0;0.4998;0.5598;0.6548;0.6664;1" dur="24s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="c4"><rect x="88" y="260" height="30" width="0"><animate attributeName="width" values="0;0;314;314;0;0" keyTimes="0;0.6664;0.7264;0.8214;0.833;1" dur="24s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="c5"><rect x="88" y="260" height="30" width="0"><animate attributeName="width" values="0;0;424;424;0" keyTimes="0;0.833;0.893;0.988;1" dur="24s" repeatCount="indefinite"/></rect></clipPath>
</defs>

<rect width="1000" height="400" rx="14" fill="#070b12"/>
