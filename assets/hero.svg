<text class="m" x="236" y="96" font-size="12" fill="#4fd8ff" letter-spacing="2">/ OPEN TO AI/ML INTERNSHIPS</text>

<text class="s" x="60" y="172" font-size="58" font-weight="800" fill="#e6edf3" textLength="540" lengthAdjust="spacingAndGlyphs">RAUSHAN <tspan fill="#4fd8ff">KUMAR</tspan></text>
<text class="s" x="62" y="210" font-size="19" font-weight="600" letter-spacing="9" fill="#4fd8ff">AI × SOFTWARE × HARDWARE</text>
<line class="dash" x1="62" y1="236" x2="600" y2="236" stroke="#4fd8ff" stroke-opacity=".5"/>

<text class="m" x="62" y="283" font-size="20" fill="#4fd8ff">&gt;</text>
