<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Project 02 — WisdomLens">
<defs>
<style>.m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif}</style>
<linearGradient id="sw"><stop offset="0" stop-color="#4fd8ff" stop-opacity="0"/><stop offset=".5" stop-color="#4fd8ff"/><stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="999" height="249" rx="12" fill="#070b12" stroke="#16283a"/>
<text class="s" x="975" y="225" text-anchor="end" font-size="190" font-weight="800" fill="#0b1520">02</text>
<rect width="5" height="250" rx="2" fill="#4fd8ff"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></rect>
<rect y="0" width="140" height="2" fill="url(#sw)"><animate attributeName="x" from="-140" to="1000" dur="6s" repeatCount="indefinite"/></rect>
<text class="m" x="40" y="46" font-size="12" letter-spacing="4" fill="#4fd8ff">PROJECT 02</text>
<text class="m" x="960" y="46" text-anchor="end" font-size="11" letter-spacing="3" fill="#4b5c6e">RAG · LOCAL LLM</text>
<text class="s" x="40" y="94" font-size="40" font-weight="800" fill="#e6edf3">WISDOMLENS</text>
<text class="s" x="40" y="122" font-size="17" fill="#8b9bab">Intelligent Knowledge Assistant</text>
<line x1="40" y1="142" x2="960" y2="142" stroke="#16283a"/>
<g class="m" font-size="13">
<text x="40" y="170" fill="#4fd8ff" fill-opacity=".8">PROBLEM</text><text x="130" y="170" fill="#c9d1d9">Getting context-aware answers from a knowledge base instead of keyword-searching it.</text>
